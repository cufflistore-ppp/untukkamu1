<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Natal Premium + Video</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#b91c1c33,#fff,#b91c1c22);padding:2rem 1rem;color:#1e293b}
.card{background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-radius:24px;padding:2.2rem 1.6rem;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12);animation:up .7s ease}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.photo{width:112px;height:112px;border-radius:50%;object-fit:cover;margin:0 auto 1.2rem;border:4px solid #b91c1c;box-shadow:0 0 18px #b91c1c66}
.title{font-family:'Great Vibes',cursive;font-size:2.4rem;color:#b91c1c;margin-bottom:.4rem}
.recipient{font-size:1.1rem;font-weight:600;color:#64748b;margin-bottom:1rem}
.message{font-size:.98rem;line-height:1.7;color:#475569;white-space:pre-wrap}
.branding{margin-top:1.6rem;font-size:.78rem;color:#94a3b8}
.branding a{font-family:'Great Vibes',cursive;font-size:1rem;color:#b91c1c;text-decoration:none}
.badge-vid{display:inline-block;font-size:.7rem;padding:.2rem .5rem;border-radius:999px;background:#b91c1c;color:#fff;margin-bottom:.8rem}
</style></head><body>
<div class="card">
  <div class='badge-vid'>Premium · Foto + Video</div>
  <img class="photo" id="photo" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=200&q=80" alt="">
  
    <div id="videoWrap" style="display:none;margin:0 auto 1.2rem;max-width:100%;border-radius:16px;overflow:hidden;">
      <div id="videoInner"></div>
    </div>
  <h1 class="title" id="title">Merry Christmas</h1>
  <p class="recipient" id="recipient">Keluarga</p>
  <p class="message" id="message">Video ucapan Natal dari hatiku.</p>
</div>
<div class="branding" id="branding">Dibuat dengan <a href="index.html">Untuk Kamu</a></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('title')) document.getElementById('title').textContent=params.get('title');
  if(params.get('recipient')||params.get('name')) document.getElementById('recipient').textContent=params.get('recipient')||params.get('name');
  if(params.get('message')) document.getElementById('message').textContent=params.get('message');
  const photoKey=params.get('photoKey');
  if(photoKey){try{const d=sessionStorage.getItem(photoKey);if(d)document.getElementById('photo').src=d;}catch(e){}}
  else if(params.get('photo')) document.getElementById('photo').src=params.get('photo');
  if(params.get('hideBranding')==='1') document.getElementById('branding').style.display='none';
  const color=params.get('color');
  if(color){
    const photo=document.getElementById('photo'), title=document.getElementById('title');
    if(photo){photo.style.borderColor=color;photo.style.boxShadow='0 0 18px '+color+'66';}
    if(title) title.style.color=color;
    document.body.style.background='linear-gradient(135deg,'+color+'33,#fff,'+color+'22)';
  }
  
    const video=params.get('video');
    if(video){
      const wrap=document.getElementById('videoWrap');
      const inner=document.getElementById('videoInner');
      if(wrap&&inner){
        wrap.style.display='block';
        let src=video;
        const yt=src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
        if(yt){
          inner.innerHTML='<iframe width="100%" height="220" src="https://www.youtube.com/embed/'+yt[1]+'" frameborder="0" allowfullscreen style="border:0;border-radius:16px;"></iframe>';
        } else {
          inner.innerHTML='<video controls playsinline style="width:100%;border-radius:16px;max-height:280px;background:#000" src="'+src.replace(/"/g,'&quot;')+'"></video>';
        }
      }
    }

})();
</script>
<script src="music.js"></script>
<script>(function(){var p=new URLSearchParams(location.search);if(p.get('music')==='1'&&p.get('musicUrl')&&typeof mountMusicPlayer==='function')mountMusicPlayer({url:p.get('musicUrl'),autoplay:true});})();</script>
</body></html>
