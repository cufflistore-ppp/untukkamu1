<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar — 𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</title>
  <meta name="google-signin-client_id" content="206795016846-rkoh7bcgj031ijrue9r03f4sjng11b4h.apps.googleusercontent.com">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page-loader">
    <div class="loader-spinner"></div>
  <script>
  (function(){
    try {
      var t = localStorage.getItem('uk_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
    function h(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }
    if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(h, 0);
    document.addEventListener('DOMContentLoaded', h);
    window.addEventListener('load', h);
    setTimeout(h, 1500);
  })();
  </script>

    <div class="loader-text">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</div>
  </div>

  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <p style="font-size:0.85rem;color:var(--text-muted);margin:0 0 0.6rem;">Pengunjung baru wajib daftar sebelum masuk ke website.</p>
        <a href="index.html" class="brand-title-sm" data-nav>𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</a>
        <p>Daftar dulu untuk masuk</p>
      </div>
      
      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="displayName">Nama</label>
          <input type="text" id="displayName" class="form-input" placeholder="Nama lengkap" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email</label>
          <input type="email" id="email" class="form-input" placeholder="email@contoh.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="Min. 6 karakter" required minlength="6" autocomplete="new-password">
        </div>
        <div class="form-group">
          <label class="form-label" for="passwordConfirm">Konfirmasi Password</label>
          <input type="password" id="passwordConfirm" class="form-input" placeholder="Ulangi password" required minlength="6">
        </div>
        <div class="form-error" id="registerError"></div>
        <button type="submit" class="btn btn-primary w-full" id="registerBtn">
          <i class="fa-solid fa-user-plus"></i> Daftar
        </button>
      </form>
      
      <div class="auth-divider">atau</div>
      
      <button class="btn btn-google" id="googleRegisterBtn">
        <i class="fa-brands fa-google"></i> Daftar dengan Google
      </button>
      
      <p class="text-center mt-2" style="font-size: 0.9rem; color: var(--text-secondary);">
        Sudah punya akun? <a href="login.html" data-nav style="color: var(--pink); font-weight: 600;">Masuk</a>
      </p>
      
      <div class="text-center mt-2">
        <button class="theme-toggle" style="margin: 0 auto;"><i class="fa-solid fa-moon"></i></button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="register.js"></script>
</body>
</html>
