<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project — 𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body { background: var(--bg-primary); }
    #projectFrame {
      width: 100%;
      min-height: 100vh;
      border: none;
    }
    .not-found {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="page-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</div>
  </div>
  
  <div id="notFound" class="not-found hidden">
    <i class="fa-solid fa-circle-info" style="font-size: 3rem; margin-bottom: 1rem; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
    <h1>Project Tidak Ditemukan</h1>
    <p style="color: var(--text-secondary); margin: 0.5rem 0 1.5rem;">Kode project tidak valid atau sudah dihapus.</p>
    <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house"></i> Kembali ke Beranda</a>
  </div>
  

  <div id="pinGate" class="not-found hidden">
    <i class="fa-solid fa-lock" style="font-size: 2.5rem; margin-bottom: 1rem; background: var(--gradient-main); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
    <h1 style="font-size:1.4rem;margin-bottom:0.4rem;">Masukkan Kode Akses</h1>
    <p style="color: var(--text-secondary); margin: 0 0 1.2rem; font-size:0.9rem;">Project ini dilindungi kode. Minta kodenya ke pengirim link.</p>
    <div style="width:100%;max-width:280px;">
      <input type="text" id="pinGateInput" class="form-input" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Kode (min. 4 digit)" style="text-align:center;font-size:1.2rem;letter-spacing:0.2em;margin-bottom:0.75rem;">
      <p id="pinGateError" style="color:#f87171;font-size:0.85rem;min-height:1.2em;margin-bottom:0.5rem;"></p>
      <button type="button" class="btn btn-primary w-full" id="pinGateSubmit">
        <i class="fa-solid fa-right-to-bracket"></i> Buka Project
      </button>
    </div>
  </div>

  <iframe id="projectFrame" class="hidden"></iframe>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="music.js"></script>
  <script src="public-project.js"></script>
</body>
</html>
