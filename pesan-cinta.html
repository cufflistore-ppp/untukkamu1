<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pesan Cinta</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#fdf2f8,#fce7f3,#ede9fe);padding:2rem 1rem;color:#1e293b;transition:background .4s}
    .card{background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-radius:24px;padding:2.5rem 2rem;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12);animation:fadeUp .8s ease}
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
    .photo{width:120px;height:120px;border-radius:50%;object-fit:cover;margin:0 auto 1.5rem;border:4px solid #ec4899;box-shadow:0 0 20px #ec489966}
    .title{font-family:'Great Vibes',cursive;font-size:2.6rem;color:#ec4899;margin-bottom:.5rem}
    .recipient{font-size:1.15rem;font-weight:600;color:#64748b;margin-bottom:1.2rem}
    .message{font-size:1rem;line-height:1.7;color:#475569;margin-bottom:1.5rem;white-space:pre-wrap}
    .branding{margin-top:2rem;font-size:.8rem;color:#94a3b8}
    .branding a{font-family:'Great Vibes',cursive;font-size:1rem;color:#ec4899;text-decoration:none}
  
.card{position:relative;overflow:hidden;border:1.5px solid transparent;background:
  linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.95)) padding-box,
  linear-gradient(135deg,#f472b6,#a78bfa,#38bdf8) border-box;
  box-shadow:0 24px 70px rgba(167,139,250,.28),0 0 40px rgba(244,114,182,.12)!important}
.card::before{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:80%;background:radial-gradient(circle,rgba(244,114,182,.15),transparent 70%);pointer-events:none}
.photo{border-width:4px!important;box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 28px rgba(244,114,182,.45)!important;animation:pulseGlow 2.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 20px rgba(244,114,182,.35)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 32px rgba(167,139,250,.55)}}
.title{text-shadow:0 2px 20px rgba(167,139,250,.25)}
.badge-vid,.badge-prem{background:linear-gradient(135deg,#fbbf24,#f472b6)!important;color:#1e293b!important;font-weight:700;letter-spacing:.02em}
#videoWrap{border:2px solid #f472b6;box-shadow:0 8px 28px rgba(244,114,182,.3);border-radius:16px;overflow:hidden}
#videoWrap video{width:100%;display:block;max-height:240px;background:#000}

</style>
</head>
<body>
  <div class="card">
    <img class="photo" id="photo" src="https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=400&q=80" alt="Foto">
    <h1 class="title" id="title">Pesan Cinta</h1>
    <p class="recipient" id="recipient">Kekasihku</p>
    <p class="message" id="message">Dari hati yang paling dalam, aku mencintaimu.</p>
  </div>
  <div class="branding" id="branding">Dibuat dengan <a href="index.html">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</a></div>
  <script>
  (function(){
    const params=new URLSearchParams(location.search);
    if(params.get('title')) document.getElementById('title').textContent=params.get('title');
    if(params.get('recipient')||params.get('name')) document.getElementById('recipient').textContent=params.get('recipient')||params.get('name');
    if(params.get('message')) document.getElementById('message').textContent=params.get('message');
    const photoKey=params.get('photoKey');
    if(photoKey){try{const d=sessionStorage.getItem(photoKey);if(d)document.getElementById('photo').src=d;}catch(e){}}
    else if(params.get('photo')) document.getElementById('photo').src=params.get('photo');
    if(params.get('hideBranding')==='1') document.getElementById('branding').style.display='none';
    const color=params.get('color');
    if(color){
      const photo=document.getElementById('photo'), title=document.getElementById('title');
      if(photo){photo.style.borderColor=color;photo.style.boxShadow='0 0 20px '+color+'66';}
      if(title) title.style.color=color;
      document.body.style.background='linear-gradient(135deg, '+color+'22, #ffffff, '+color+'33)';
    }
  })();
  </script>
  <script src="music.js"></script>
  <script>
  (function(){var p=new URLSearchParams(location.search);if(p.get("music")==="1"&&p.get("musicUrl")&&typeof mountMusicPlayer==="function"){mountMusicPlayer({url:p.get("musicUrl"),autoplay:true,title:"Musik"});},autoplay:true});})();
  </script>
</body>
</html>
