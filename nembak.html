<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nembak</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fce7f3, #ede9fe, #dbeafe);
      padding: 1.5rem;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.92);
      border-radius: 24px;
      padding: 2rem 1.5rem;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(244,114,182,0.2);
      position: relative;
      z-index: 2;
    }
    .photo {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 1.2rem;
      border: 3px solid #f9a8d4;
    }
    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.4rem;
      background: linear-gradient(135deg, #38bdf8, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.4rem;
    }
    .name { font-weight: 600; color: #64748b; margin-bottom: 1rem; }
    .message { color: #475569; line-height: 1.6; margin-bottom: 1.8rem; font-size: 0.95rem; }
    .buttons { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      padding: 0.8rem 1.8rem;
      border-radius: 50px;
      border: none;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
    }
    .btn-yes {
      background: linear-gradient(135deg, #34d399, #10b981);
      color: #fff;
      box-shadow: 0 4px 15px rgba(16,185,129,0.3);
    }
    .btn-yes:hover { transform: scale(1.05); }
    .btn-no {
      background: #f1f5f9;
      color: #64748b;
      position: relative;
    }
    .result {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem;
      border-radius: 16px;
      font-weight: 600;
      animation: pop 0.4s ease;
    }
    .result.show { display: block; }
    .result.yes { background: #d1fae5; color: #065f46; }
    .result.no { background: #fce7f3; color: #9d174d; }
    @keyframes pop {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .hearts {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }
    .heart {
      position: absolute;
      font-size: 1.2rem;
      animation: floatUp 3s ease-in forwards;
      opacity: 0.7;
    }
    @keyframes floatUp {
      0% { transform: translateY(100vh) rotate(0); opacity: 0.8; }
      100% { transform: translateY(-20vh) rotate(360deg); opacity: 0; }
    }
    .branding {
      margin-top: 1.5rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .branding a {
      font-family: 'Great Vibes', cursive;
      background: linear-gradient(135deg, #38bdf8, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
  
.card{position:relative;overflow:hidden;border:1.5px solid transparent;background:
  linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.95)) padding-box,
  linear-gradient(135deg,#f472b6,#a78bfa,#38bdf8) border-box;
  box-shadow:0 24px 70px rgba(167,139,250,.28),0 0 40px rgba(244,114,182,.12)!important}
.card::before{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:80%;background:radial-gradient(circle,rgba(244,114,182,.15),transparent 70%);pointer-events:none}
.photo{border-width:4px!important;box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 28px rgba(244,114,182,.45)!important;animation:pulseGlow 2.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 20px rgba(244,114,182,.35)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 32px rgba(167,139,250,.55)}}
.title{text-shadow:0 2px 20px rgba(167,139,250,.25)}
.badge-vid,.badge-prem{background:linear-gradient(135deg,#fbbf24,#f472b6)!important;color:#1e293b!important;font-weight:700;letter-spacing:.02em}
#videoWrap{border:2px solid #f472b6;box-shadow:0 8px 28px rgba(244,114,182,.3);border-radius:16px;overflow:hidden}
#videoWrap video{width:100%;display:block;max-height:240px;background:#000}

</style>
</head>
<body>
  <div class="hearts" id="hearts"></div>
  <div class="card">
    <img class="photo" id="photo" src="https://images.unsplash.com/photo-1523580846011-d3a5bc25702b?w=400&q=80" alt="Foto">
    <h1 class="title" id="title">Maukah Kamu?</h1>
    <p class="name" id="name">Untuk kamu yang spesial</p>
    <p class="message" id="message">Aku punya sesuatu yang ingin aku sampaikan... Maukah kamu menjadi bagian dari hidupku?</p>
    <div class="buttons" id="buttons">
      <button class="btn btn-yes" id="btnYes">Ya!</button>
      <button class="btn btn-no" id="btnNo">Tidak</button>
    </div>
    <div class="result" id="result"></div>
  </div>
  <div class="branding" id="branding">
    Dibuat dengan <a href="index.html">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</a>
  </div>
  
  <script>
    const params = new URLSearchParams(window.location.search);
    if (params.get('title')) document.getElementById('title').textContent = params.get('title');
    if (params.get('name') || params.get('recipient')) {
      const el = document.getElementById('name') || document.getElementById('recipient');
      if (el) el.textContent = params.get('name') || params.get('recipient');
    }
    if (params.get('message')) document.getElementById('message').textContent = params.get('message');
    const photoKey = params.get('photoKey');
    if (photoKey) {
      try {
        const photoData = sessionStorage.getItem(photoKey);
        if (photoData) document.getElementById('photo').src = photoData;
      } catch(e) {}
    } else if (params.get('photo')) {
      document.getElementById('photo').src = params.get('photo');
    }
    
    const color = params.get('color');
    if (color) {
      const photo = document.getElementById('photo');
      const title = document.getElementById('title');
      if (photo) { photo.style.borderColor = color; photo.style.boxShadow = '0 0 20px ' + color + '66'; }
      if (title) title.style.color = color;
      document.body.style.background = 'linear-gradient(135deg, ' + color + '22, #ffffff, ' + color + '33)';
    }
    if (params.get('hideBranding') === '1') {
      const b = document.getElementById('branding');
      if (b) b.style.display = 'none';
    }
    
    const btnNo = document.getElementById('btnNo');
    const btnYes = document.getElementById('btnYes');
    const result = document.getElementById('result');
    let noCount = 0;
    
    // Playful: "Tidak" button runs away
    btnNo.addEventListener('mouseover', () => {
      if (noCount < 5) {
        const x = Math.random() * 120 - 60;
        const y = Math.random() * 80 - 40;
        btnNo.style.transform = `translate(${x}px, ${y}px)`;
        noCount++;
      }
    });
    
    btnNo.addEventListener('click', () => {
      result.textContent = 'Yah... coba pikir lagi ya?';
      result.className = 'result show no';
    });
    
    btnYes.addEventListener('click', () => {
      result.textContent = 'Yeeay! Terima kasih sudah menjawab Ya!';
      result.className = 'result show yes';
      document.getElementById('buttons').style.display = 'none';
      // Hearts animation
      for (let i = 0; i < 20; i++) {
        setTimeout(() => {
          const h = document.createElement('div');
          h.className = 'heart';
          h.textContent = '♥';
          h.style.left = Math.random() * 100 + '%';
          h.style.color = ['#f472b6', '#a78bfa', '#38bdf8', '#f9a8d4'][Math.floor(Math.random()*4)];
          document.getElementById('hearts').appendChild(h);
          setTimeout(() => h.remove(), 3000);
        }, i * 100);
      }
    });
  <script>
  // Tampilkan video galeri (MP4/WebM URL) — wajib terlihat
  (function(){
    var v = params.get('video');
    var wrap = document.getElementById('videoWrap');
    var inner = document.getElementById('videoInner');
    if (!v || !wrap) return;
    wrap.style.display = 'block';
    if (!inner) { inner = document.createElement('div'); inner.id = 'videoInner'; wrap.appendChild(inner); }
    v = decodeURIComponent(v);
    if (/youtube\.com|youtu\.be|vimeo/i.test(v)) {
      // user minta galeri, bukan YT — tetap skip embed YT
      inner.innerHTML = '<p style="padding:0.8rem;font-size:0.85rem;color:#64748b">Video harus dari galeri (file HP), bukan YouTube.</p>';
      return;
    }
    inner.innerHTML = '<video controls playsinline autoplay muted loop preload="metadata" src="'+v.replace(/"/g,'&quot;')+'" style="width:100%;max-height:240px;background:#000"></video>';
  })();
</script>
<script src="music.js"></script>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  if(p.get("music")==="1"&&p.get("musicUrl")&&typeof mountMusicPlayer==="function"){mountMusicPlayer({url:p.get("musicUrl"),autoplay:true,title:"Musik"});}, autoplay: true });
    }
  }
})();
</script>
</body>
</html>
