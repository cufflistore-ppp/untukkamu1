<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Saya — 𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script>
  (function(){
    try {
      if (localStorage.getItem('uk_authed') !== '1') {
        location.replace('login.html');
      }
    } catch (e) {}
  })();
  </script>

</head>
<body>
  <div id="page-loader">
    <div class="loader-spinner"></div>
  <script>
  (function(){
    try {
      var t = localStorage.getItem('uk_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) {}
    function h(){ var l=document.getElementById('page-loader'); if(l) l.classList.add('hidden'); }
    if (document.readyState === 'complete' || document.readyState === 'interactive') setTimeout(h, 0);
    document.addEventListener('DOMContentLoaded', h);
    window.addEventListener('load', h);
    setTimeout(h, 1500);
  })();
  </script>

    <div class="loader-text">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</div>
  </div>

  
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="top-bar-left"><img src="logo.jpg" alt="Logo" class="top-bar-logo"><a href="index.html" class="top-bar-brand" data-nav>𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</a></div>
    <button class="theme-toggle" aria-label="Ganti tema"><i class="fa-solid fa-moon"></i></button>
  </div>

  <!-- Bottom Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-links">
        <a href="template.html" class="nav-link" data-nav><i class="fa-solid fa-file"></i><span>Template</span></a>
        <a href="proyek.html" class="nav-link" data-nav><i class="fa-solid fa-folder"></i><span>Proyek</span></a>
        <a href="index.html" class="nav-link" data-nav><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a href="about.html" class="nav-link" data-nav><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a>
        <a href="profile.html" class="nav-link active" data-nav><i class="fa-solid fa-user"></i><span>Saya</span></a>
      </div>
    </div>
  </nav>


  <main class="page-content">
    <div class="container">
      <!-- Not logged in -->
      <div id="guestView" class="hidden">
        <div class="empty-state">
          <i class="fa-solid fa-user"></i>
          <h2>Belum masuk</h2>
          <p>Masuk atau daftar untuk melihat profil dan proyekmu.</p>
          <div class="flex gap-2 justify-center mt-2" style="justify-content: center;">
            <a href="login.html" class="btn btn-primary" data-nav><i class="fa-solid fa-right-to-bracket"></i> Masuk</a>
            <a href="register.html" class="btn btn-secondary" data-nav><i class="fa-solid fa-user-plus"></i> Daftar</a>
          </div>
        </div>
      </div>
      
      <!-- Logged in -->
      <div id="userView" class="hidden">
        <div class="profile-header">
          <img id="userAvatar" class="profile-avatar" src="" alt="Avatar">
          <div class="profile-info">
            <h1 id="userName">Nama</h1>
            <p id="userEmail" style="color: var(--text-secondary);"></p>
            <div class="flex gap-1 mt-1 flex-wrap">
              <a href="topup.html" class="btn btn-primary btn-sm" data-nav><i class="fa-solid fa-wallet"></i> Top Up</a>
              <a href="proyek.html" class="btn btn-secondary btn-sm" data-nav><i class="fa-solid fa-folder"></i> Proyek Saya</a>
              <a href="admin.html" class="btn btn-outline btn-sm admin-only hidden" data-nav><i class="fa-solid fa-gear"></i> Admin</a>
              <button class="btn btn-outline btn-sm" id="logoutBtn"><i class="fa-solid fa-right-from-bracket"></i> Keluar</button>
            </div>
          </div>
        </div>
        
        <div class="profile-stats">
          <div class="stat-card">
            <div class="stat-value user-balance">Rp0</div>
            <div class="stat-label">Saldo</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="projectCount">0</div>
            <div class="stat-label">Proyek</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="purchaseCount">0</div>
            <div class="stat-label">Pembelian</div>
          </div>
        </div>
        
        <!-- Recent Projects -->
        <div class="section">
          <div class="section-title">
            <i class="fa-solid fa-folder"></i>
            <h2>Proyek Terbaru</h2>
          </div>
          <div class="grid grid-3" id="recentProjects">
            <div class="empty-state" style="grid-column: 1/-1;">
              <i class="fa-solid fa-folder-open"></i>
              <p>Belum ada proyek. <a href="template.html" data-nav style="color: var(--pink);">Buat sekarang</a></p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-bottom">&copy; 2026 𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</div>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="profile.js"></script>
</body>
</html>
