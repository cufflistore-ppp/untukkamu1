<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor — 𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="page-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</div>
  </div>

  
  <!-- Top Bar -->
  <div class="top-bar">
    <a href="index.html" class="top-bar-brand" data-nav>𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</a>
    <button class="theme-toggle" aria-label="Ganti tema"><i class="fa-solid fa-moon"></i></button>
  </div>

  <!-- Bottom Navbar -->
  <nav class="navbar">
    <div class="navbar-inner">
      <div class="nav-links">
        <a href="template.html" class="nav-link" data-nav><i class="fa-solid fa-file"></i><span>Template</span></a>
        <a href="proyek.html" class="nav-link active" data-nav><i class="fa-solid fa-folder"></i><span>Proyek</span></a>
        <a href="index.html" class="nav-link" data-nav><i class="fa-solid fa-house"></i><span>Beranda</span></a>
        <a href="about.html" class="nav-link" data-nav><i class="fa-solid fa-circle-info"></i><span>Tentang</span></a>
        <a href="profile.html" class="nav-link" data-nav><i class="fa-solid fa-user"></i><span>Saya</span></a>
      </div>
    </div>
  </nav>


  <main class="page-content">
    <div class="container">
      <div class="editor-layout">
        <!-- Sidebar -->
        <div class="editor-sidebar">
          <h3 class="mb-2"><i class="fa-solid fa-pen"></i> Edit Project</h3>
          
          <div class="form-group">
            <label class="form-label">Judul</label>
            <input type="text" id="editTitle" class="form-input" placeholder="Judul">
          </div>
          
          <div class="form-group">
            <label class="form-label">Nama / Penerima</label>
            <input type="text" id="editName" class="form-input" placeholder="Nama penerima">
          </div>
          
          <div class="form-group">
            <label class="form-label">Pesan</label>
            <textarea id="editMessage" class="form-textarea" placeholder="Tulis pesanmu..."></textarea>
          </div>
          
          <div class="form-group">
            <label class="form-label">Foto</label>
            <input type="file" id="editPhoto" class="form-input" accept="image/*">
            <div id="photoPreviewBox" class="mt-1 hidden">
              <img id="photoPreview" style="max-width: 100%; border-radius: 10px; max-height: 150px;">
              <button class="btn btn-danger btn-sm mt-1" id="removePhoto"><i class="fa-solid fa-trash"></i> Hapus Foto</button>
            </div>
          </div>
          
          <div class="form-group">
            <label class="form-label">Warna Tema</label>
            <div class="color-picker-row">
              <div class="color-swatch active" style="background: #7dd3fc;" data-color="#7dd3fc"></div>
              <div class="color-swatch" style="background: #f9a8d4;" data-color="#f9a8d4"></div>
              <div class="color-swatch" style="background: #c4b5fd;" data-color="#c4b5fd"></div>
              <div class="color-swatch" style="background: #fbbf24;" data-color="#fbbf24"></div>
              <div class="color-swatch" style="background: #34d399;" data-color="#34d399"></div>
              <div class="color-swatch" style="background: #f87171;" data-color="#f87171"></div>
            </div>
          </div>
          
          <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 1rem;">
            <i class="fa-solid fa-circle-info"></i> Perubahan langsung terlihat di preview.
          </p>
        </div>
        
        <!-- Preview -->
        <div class="editor-preview">
          <iframe id="previewFrame" src="about:blank"></iframe>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-storage-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="auth.js"></script>
  <script src="editor.js"></script>
</body>
</html>
