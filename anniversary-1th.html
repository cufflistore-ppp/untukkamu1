<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anniversary 1 Tahun</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#be185d33,#fff,#be185d22);padding:2rem 1rem;color:#1e293b}
.card{background:rgba(255,255,255,.93);backdrop-filter:blur(12px);border-radius:24px;padding:2.2rem 1.6rem;max-width:420px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.12);animation:up .7s ease}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.photo{width:112px;height:112px;border-radius:50%;object-fit:cover;margin:0 auto 1.2rem;border:4px solid #be185d;box-shadow:0 0 18px #be185d66}
.title{font-family:'Great Vibes',cursive;font-size:2.4rem;color:#be185d;margin-bottom:.4rem}
.recipient{font-size:1.1rem;font-weight:600;color:#64748b;margin-bottom:1rem}
.message{font-size:.98rem;line-height:1.7;color:#475569;white-space:pre-wrap}
.branding{margin-top:1.6rem;font-size:.78rem;color:#94a3b8}
.branding a{font-family:'Great Vibes',cursive;font-size:1rem;color:#be185d;text-decoration:none}
.badge-vid{display:inline-block;font-size:.7rem;padding:.2rem .5rem;border-radius:999px;background:#be185d;color:#fff;margin-bottom:.8rem}

.card{position:relative;overflow:hidden;border:1.5px solid transparent;background:
  linear-gradient(rgba(255,255,255,.95),rgba(255,255,255,.95)) padding-box,
  linear-gradient(135deg,#f472b6,#a78bfa,#38bdf8) border-box;
  box-shadow:0 24px 70px rgba(167,139,250,.28),0 0 40px rgba(244,114,182,.12)!important}
.card::before{content:'';position:absolute;top:-40%;left:-20%;width:60%;height:80%;background:radial-gradient(circle,rgba(244,114,182,.15),transparent 70%);pointer-events:none}
.photo{border-width:4px!important;box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 28px rgba(244,114,182,.45)!important;animation:pulseGlow 2.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 0 4px rgba(255,255,255,.5),0 0 20px rgba(244,114,182,.35)}50%{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 0 32px rgba(167,139,250,.55)}}
.title{text-shadow:0 2px 20px rgba(167,139,250,.25)}
.badge-vid,.badge-prem{background:linear-gradient(135deg,#fbbf24,#f472b6)!important;color:#1e293b!important;font-weight:700;letter-spacing:.02em}
#videoWrap{border:2px solid #f472b6;box-shadow:0 8px 28px rgba(244,114,182,.3);border-radius:16px;overflow:hidden}
#videoWrap video{width:100%;display:block;max-height:240px;background:#000}

</style></head><body>
<div class="card">
  
  <img class="photo" id="photo" src="https://images.unsplash.com/photo-1513151233558-d860c5398176?w=400&q=80" alt="">
  <div id="videoWrap" style="display:none;margin:0 auto 1.2rem;"><div id="videoInner"></div></div>
  <h1 class="title" id="title">Anniversary 1 Tahun</h1>
  <p class="recipient" id="recipient">Sayang</p>
  <p class="message" id="message">Setahun penuh cinta dan tumbuh bersama.</p>
</div>
<div class="branding" id="branding">Dibuat dengan <a href="index.html">Untuk Kamu</a></div>
<script>
(function(){
  const params=new URLSearchParams(location.search);
  if(params.get('title')) document.getElementById('title').textContent=params.get('title');
  if(params.get('recipient')||params.get('name')) document.getElementById('recipient').textContent=params.get('recipient')||params.get('name');
  if(params.get('message')) document.getElementById('message').textContent=params.get('message');
  const photoKey=params.get('photoKey');
  if(photoKey){try{const d=sessionStorage.getItem(photoKey);if(d)document.getElementById('photo').src=d;}catch(e){}}
  else if(params.get('photo')) document.getElementById('photo').src=params.get('photo');
  
  // Tampilkan video galeri (MP4/WebM URL) — wajib terlihat
  (function(){
    var v = params.get('video');
    var wrap = document.getElementById('videoWrap');
    var inner = document.getElementById('videoInner');
    if (!v || !wrap) return;
    wrap.style.display = 'block';
    if (!inner) { inner = document.createElement('div'); inner.id = 'videoInner'; wrap.appendChild(inner); }
    v = decodeURIComponent(v);
    if (/youtube\.com|youtu\.be|vimeo/i.test(v)) {
      // user minta galeri, bukan YT — tetap skip embed YT
      inner.innerHTML = '<p style="padding:0.8rem;font-size:0.85rem;color:#64748b">Video harus dari galeri (file HP), bukan YouTube.</p>';
      return;
    }
    inner.innerHTML = '<video controls playsinline autoplay muted loop preload="metadata" src="'+v.replace(/"/g,'&quot;')+'" style="width:100%;max-height:240px;background:#000"></video>';
  })();

if(params.get('hideBranding')==='1') document.getElementById('branding').style.display='none';
  const color=params.get('color');
  if(color){
    const photo=document.getElementById('photo'), title=document.getElementById('title');
    if(photo){photo.style.borderColor=color;photo.style.boxShadow='0 0 18px '+color+'66';}
    if(title) title.style.color=color;
    document.body.style.background='linear-gradient(135deg,'+color+'33,#fff,'+color+'22)';
  }
  
    const video=params.get('video');
    if(video){
      const wrap=document.getElementById('videoWrap');
      const inner=document.getElementById('videoInner');
      if(wrap&&inner){
        wrap.style.display='block';
        let src=video;
        const yt=src.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([A-Za-z0-9_-]{6,})/);
        if(yt){
          inner.innerHTML='<iframe width="100%" height="220" src="https://www.youtube.com/embed/'+yt[1]+'" frameborder="0" allowfullscreen style="border:0;border-radius:16px;"></iframe>';
        } else {
          inner.innerHTML='<video controls playsinline style="width:100%;border-radius:16px;max-height:280px;background:#000" src="'+src.replace(/"/g,'&quot;')+'"></video>';
        }
      }
    }

})();
</script>
<script src="music.js"></script>
<script>(function(){var p=new URLSearchParams(location.search);if(p.get("music")==="1"&&p.get("musicUrl")&&typeof mountMusicPlayer==="function"){mountMusicPlayer({url:p.get("musicUrl"),autoplay:true,title:"Musik"});},autoplay:true});})();</script>
</body></html>
