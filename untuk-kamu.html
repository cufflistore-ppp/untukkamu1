<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untuk Kamu</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #fdf2f8, #ede9fe, #e0f2fe);
      padding: 2rem 1rem;
      color: #1e293b;
    }
    .card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 2.5rem 2rem;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(168,85,247,0.15);
      animation: fadeUp 0.8s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .photo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      margin: 0 auto 1.5rem;
      border: 4px solid #f9a8d4;
      box-shadow: 0 0 20px rgba(249,168,212,0.4);
    }
    .title {
      font-family: 'Great Vibes', cursive;
      font-size: 2.8rem;
      background: linear-gradient(135deg, #38bdf8, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }
    .recipient {
      font-size: 1.2rem;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 1.2rem;
    }
    .message {
      font-size: 1rem;
      line-height: 1.7;
      color: #475569;
      margin-bottom: 1.5rem;
    }
    .branding {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #94a3b8;
    }
    .branding a {
      font-family: 'Great Vibes', cursive;
      font-size: 1rem;
      background: linear-gradient(135deg, #38bdf8, #f472b6, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="photo" id="photo" src="https://images.unsplash.com/photo-1516589178581-6cd7833ae3b2?w=200&q=80" alt="Foto">
    <h1 class="title" id="title">Untuk Kamu</h1>
    <p class="recipient" id="recipient">Untuk seseorang yang spesial</p>
    <p class="message" id="message">
      Terima kasih sudah menjadi bagian dari hidupku. 
      Semoga hari-harimu selalu indah dan penuh kebahagiaan.
    </p>
  </div>
  <div class="branding" id="branding">
    Dibuat dengan <a href="index.html">𝓤𝓷𝓽𝓾𝓴 𝓚𝓪𝓶𝓾</a>
  </div>
  
  <script>
    // Load project data from parent or URL params (for editor preview / public)
    const params = new URLSearchParams(window.location.search);
    if (params.get('title')) document.getElementById('title').textContent = params.get('title');
    if (params.get('recipient')) document.getElementById('recipient').textContent = params.get('recipient');
    if (params.get('message')) document.getElementById('message').textContent = params.get('message');
    if (params.get('photo')) document.getElementById('photo').src = params.get('photo');
    if (params.get('hideBranding') === '1') document.getElementById('branding').style.display = 'none';
  </script>
<script src="music.js"></script>
<script>
(function(){
  var p = new URLSearchParams(location.search);
  if (p.get("music") === "1" && p.get("musicUrl")) {
    if (typeof mountMusicPlayer === "function") {
      mountMusicPlayer({ url: p.get("musicUrl"), autoplay: true });
    }
  }
})();
</script>
</body>
</html>
